[project]
name = "voca-voice-worker"
version = "0.1.0"
description = "Tenant-authorized LiveKit browser voice worker for Voca"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents[openai]==1.8.11",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Privacy must be installed before importing dependencies that create loggers.
"agent.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
